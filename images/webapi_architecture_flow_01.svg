<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Web API 기반 약 이미지 분석 구조</text>
  <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">앱인벤터 앱 → Web API 서버 → AI 모델 → JSON 결과 반환</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="65" y="170" width="240" height="150" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="185" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">앱인벤터 앱</text>
  <text x="185" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">사진 촬영 / 선택</text>
  <text x="185" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">웹요청1.PostFile</text>

  <rect x="480" y="170" width="240" height="150" rx="14" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="3"/>
  <text x="600" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#134e4a">Web API 서버</text>
  <text x="600" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f766e">이미지 수신</text>
  <text x="600" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f766e">전처리 / 검증</text>

  <rect x="895" y="170" width="240" height="150" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="1015" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#4c1d95">AI 모델</text>
  <text x="1015" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5b21b6">이미지 분류</text>
  <text x="1015" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5b21b6">후보 / 신뢰도 계산</text>

  <line x1="305" y1="245" x2="480" y2="245" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="720" y1="245" x2="895" y2="245" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1015 320 C1015 410 600 410 600 320" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="330" y="455" width="540" height="130" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7c2d12">JSON 응답</text>
  <text x="600" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">{"name":"타이레놀", "confidence":0.91, "status":"ok"}</text>
  <text x="600" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">앱인벤터는 GotText에서 결과라벨과 신뢰도라벨을 갱신</text>

  <path d="M600 455 C530 380 185 400 185 320" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">iPhone Companion에서는 AI 확장 대신 Web 컴포넌트를 사용해 같은 분석 결과를 받을 수 있다.</text>
</svg>
