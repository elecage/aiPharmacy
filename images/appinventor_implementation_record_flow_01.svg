<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">앱인벤터 실제 제작 기록 흐름</text>
  <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Designer 구성 → 컴포넌트 설정 → Blocks 구현 → Companion 테스트 → 캡처 정리</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="55" y="170" width="180" height="120" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="145" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">1. Designer</text>
  <text x="145" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">화면 배치</text>
  <text x="145" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">한국어 문구</text>

  <rect x="285" y="170" width="180" height="120" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="3"/>
  <text x="375" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#134e4a">2. 컴포넌트</text>
  <text x="375" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">Camera</text>
  <text x="375" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">ImagePicker</text>

  <rect x="515" y="170" width="180" height="120" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="605" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#4c1d95">3. Blocks</text>
  <text x="605" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5b21b6">사진 입력</text>
  <text x="605" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5b21b6">AI 분석</text>

  <rect x="745" y="170" width="180" height="120" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="835" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#78350f">4. 테스트</text>
  <text x="835" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#92400e">Android</text>
  <text x="835" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#92400e">Companion</text>

  <rect x="975" y="170" width="170" height="120" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="1060" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7c2d12">5. 캡처</text>
  <text x="1060" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9a3412">화면</text>
  <text x="1060" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9a3412">블록</text>

  <line x1="235" y1="230" x2="285" y2="230" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="465" y1="230" x2="515" y2="230" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="695" y1="230" x2="745" y2="230" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="925" y1="230" x2="975" y2="230" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="270" y="430" width="660" height="115" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="3"/>
  <text x="600" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">제작 기록 문서에 남길 핵심 자료</text>
  <text x="600" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">프로젝트 정보, 컴포넌트 속성, 블록 캡처, 테스트 결과, 문제 해결 기록</text>

  <path d="M1060 290 C1070 390 705 380 665 430" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M535 430 C465 365 145 385 145 290" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

  <text x="600" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">실제 제작 후에는 설계용 이미지 대신 앱인벤터 화면과 블록 캡처를 추가한다.</text>
</svg>
