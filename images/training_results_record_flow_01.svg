<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Teachable Machine 훈련 결과 기록 흐름</text>
  <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">데이터 준비 → 모델 훈련 → 테스트 → 실패 분석 → 재훈련 계획</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="70" y="170" width="180" height="115" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="160" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">1. 데이터</text>
  <text x="160" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">클래스별 이미지</text>
  <text x="160" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">테스트 분리</text>

  <rect x="300" y="170" width="180" height="115" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="390" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#4c1d95">2. 훈련</text>
  <text x="390" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5b21b6">Train Model</text>
  <text x="390" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5b21b6">버전 기록</text>

  <rect x="530" y="170" width="180" height="115" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="3"/>
  <text x="620" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#134e4a">3. 테스트</text>
  <text x="620" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">실제 약 비교</text>
  <text x="620" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">신뢰도 기록</text>

  <rect x="760" y="170" width="180" height="115" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="3"/>
  <text x="850" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7f1d1d">4. 실패 분석</text>
  <text x="850" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">오분류 원인</text>
  <text x="850" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">데이터 부족</text>

  <rect x="990" y="170" width="160" height="115" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="1070" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7c2d12">5. 개선</text>
  <text x="1070" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9a3412">데이터 추가</text>
  <text x="1070" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9a3412">재훈련</text>

  <line x1="250" y1="228" x2="300" y2="228" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="480" y1="228" x2="530" y2="228" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="710" y1="228" x2="760" y2="228" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="940" y1="228" x2="990" y2="228" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="250" y="420" width="700" height="115" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="3"/>
  <text x="600" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">훈련 결과 문서에 남길 핵심 기록</text>
  <text x="600" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">클래스별 이미지 수, 테스트 결과, 실패 사례, 개선 계획, 모델 내보내기 정보</text>

  <path d="M1070 285 C1060 390 430 365 390 285" fill="none" stroke="#9ca3af" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="600" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">훈련은 한 번으로 끝나지 않고, 실패 사례를 데이터에 반영하며 반복 개선한다.</text>
</svg>
