<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">iPhone Companion 대응 대안 구조</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">확장 기반 Android 방식과 iPhone 대응 Web 방식 분리</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="70" y="150" width="250" height="140" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="195" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Android 경로</text>
  <text x="195" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">App Inventor 앱</text>
  <text x="195" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">AI 확장 사용</text>

  <rect x="475" y="150" width="250" height="140" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="600" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#4c1d95">AI 모델</text>
  <text x="600" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5b21b6">Teachable Machine</text>
  <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5b21b6">이미지 분류 모델</text>

  <rect x="880" y="150" width="250" height="140" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="3"/>
  <text x="1005" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7f1d1d">iPhone 제약</text>
  <text x="1005" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">AI 확장 제한</text>
  <text x="1005" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">Android 확장 미지원</text>

  <line x1="320" y1="220" x2="475" y2="220" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="725" y1="220" x2="880" y2="220" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

  <rect x="170" y="420" width="300" height="150" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text x="320" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#064e3b">대안 1: Web API</text>
  <text x="320" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#047857">앱 → 서버로 사진 전송</text>
  <text x="320" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#047857">서버 → AI 결과 반환</text>

  <rect x="730" y="420" width="300" height="150" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="880" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7c2d12">대안 2: WebViewer</text>
  <text x="880" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">웹 페이지에서 AI 실행</text>
  <text x="880" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">앱은 웹 화면 표시</text>

  <path d="M1005 290 C975 365 430 350 340 420" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1005 290 C1060 365 945 350 895 420" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="390" y="635" width="420" height="62" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="600" y="674" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">권장: Android 확장 방식으로 시제품 제작 후 iPhone은 Web API 우선 검토</text>
</svg>
