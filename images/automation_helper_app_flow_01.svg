<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">앱인벤터 개발 자동화 도우미 앱 구조</text>
  <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Markdown 문서 → 구조화된 개발 정보 → 화면/블록/체크리스트 생성</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="55" y="170" width="220" height="140" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="165" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">문서 입력</text>
  <text x="165" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">1-9번 Markdown</text>
  <text x="165" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">SVG 이미지</text>

  <rect x="355" y="170" width="220" height="140" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="3"/>
  <text x="465" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#134e4a">문서 파서</text>
  <text x="465" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f766e">목차 추출</text>
  <text x="465" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f766e">표 / 체크리스트 추출</text>

  <rect x="655" y="170" width="220" height="140" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="765" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#4c1d95">개발 마법사</text>
  <text x="765" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5b21b6">단계별 안내</text>
  <text x="765" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5b21b6">자동 목록 생성</text>

  <rect x="955" y="170" width="200" height="140" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="1055" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#78350f">산출물</text>
  <text x="1055" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#92400e">컴포넌트 목록</text>
  <text x="1055" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#92400e">블록 안내</text>

  <line x1="275" y1="240" x2="355" y2="240" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="575" y1="240" x2="655" y2="240" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="875" y1="240" x2="955" y2="240" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="190" y="430" width="270" height="120" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="325" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7c2d12">1차 목표</text>
  <text x="325" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">문서 기반 개발 도우미</text>

  <rect x="740" y="430" width="270" height="120" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="3"/>
  <text x="875" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7f1d1d">2차 목표</text>
  <text x="875" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">AIA 초안 생성 검토</text>

  <path d="M765 310 C710 395 420 385 335 430" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1055 310 C1050 395 925 390 885 430" fill="none" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">초기 버전은 앱인벤터를 대신 만드는 도구가 아니라, 문서 기반 제작 과정을 자동 안내하는 도구로 시작한다.</text>
</svg>
