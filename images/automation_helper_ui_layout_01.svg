<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">자동화 도우미 앱 UI 레이아웃</title>
  <desc id="desc">왼쪽 문서 목록, 가운데 개발 단계 대시보드, 오른쪽 상세 안내 패널로 구성된 웹앱 화면 구조</desc>
  <rect width="1200" height="720" fill="#f7f8fb"/>
  <rect x="40" y="32" width="1120" height="656" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <rect x="40" y="32" width="1120" height="76" rx="18" fill="#233142"/>
  <text x="72" y="80" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">앱인벤터 개발 자동화 도우미</text>
  <text x="880" y="78" font-family="Arial, sans-serif" font-size="16" fill="#dce6f2">안전 문구 항상 표시</text>

  <rect x="72" y="132" width="270" height="512" rx="12" fill="#eef3f8" stroke="#cbd6e2"/>
  <text x="96" y="172" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#233142">문서 목록</text>
  <text x="96" y="206" font-family="Arial, sans-serif" font-size="15" fill="#4b5b6b">1-11번 Markdown 문서</text>

  <g font-family="Arial, sans-serif" font-size="15" fill="#233142">
    <rect x="96" y="232" width="220" height="38" rx="7" fill="#ffffff" stroke="#d5dee8"/>
    <text x="112" y="256">01 전체 계획</text>
    <rect x="96" y="282" width="220" height="38" rx="7" fill="#ffffff" stroke="#d5dee8"/>
    <text x="112" y="306">03 화면과 블록</text>
    <rect x="96" y="332" width="220" height="38" rx="7" fill="#ffffff" stroke="#d5dee8"/>
    <text x="112" y="356">05 테스트 체크리스트</text>
    <rect x="96" y="382" width="220" height="38" rx="7" fill="#ffffff" stroke="#d5dee8"/>
    <text x="112" y="406">08 Web API 설계</text>
    <rect x="96" y="432" width="220" height="38" rx="7" fill="#ffffff" stroke="#d5dee8"/>
    <text x="112" y="456">11 UI 데이터 설계</text>
  </g>

  <rect x="374" y="132" width="430" height="512" rx="12" fill="#ffffff" stroke="#cbd6e2"/>
  <text x="398" y="172" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#233142">개발 단계 대시보드</text>
  <text x="398" y="206" font-family="Arial, sans-serif" font-size="15" fill="#4b5b6b">기획부터 발표까지 진행 상태 표시</text>

  <g font-family="Arial, sans-serif">
    <rect x="398" y="238" width="176" height="86" rx="10" fill="#fef7e0" stroke="#e8c65f"/>
    <text x="420" y="272" font-size="18" font-weight="700" fill="#5f4a00">기획</text>
    <text x="420" y="298" font-size="14" fill="#6a5a24">안전 원칙 확인</text>

    <rect x="600" y="238" width="176" height="86" rx="10" fill="#e8f4ea" stroke="#8ec79b"/>
    <text x="622" y="272" font-size="18" font-weight="700" fill="#1f5a2d">AI 훈련</text>
    <text x="622" y="298" font-size="14" fill="#376142">결과 기록 필요</text>

    <rect x="398" y="350" width="176" height="86" rx="10" fill="#eaf2ff" stroke="#91b6e8"/>
    <text x="420" y="384" font-size="18" font-weight="700" fill="#244f83">앱인벤터 설계</text>
    <text x="420" y="410" font-size="14" fill="#365c86">컴포넌트 목록</text>

    <rect x="600" y="350" width="176" height="86" rx="10" fill="#f0ecff" stroke="#b8a9ea"/>
    <text x="622" y="384" font-size="18" font-weight="700" fill="#4b3a84">블록 구현</text>
    <text x="622" y="410" font-size="14" fill="#5c4f83">순서별 안내</text>

    <rect x="398" y="462" width="176" height="86" rx="10" fill="#fff0eb" stroke="#e6a28d"/>
    <text x="420" y="496" font-size="18" font-weight="700" fill="#883e27">iPhone 대응</text>
    <text x="420" y="522" font-size="14" fill="#7a4a3a">Web API 대안</text>

    <rect x="600" y="462" width="176" height="86" rx="10" fill="#edf7f6" stroke="#87c9c0"/>
    <text x="622" y="496" font-size="18" font-weight="700" fill="#245d59">발표 준비</text>
    <text x="622" y="522" font-size="14" fill="#376866">시연 순서 확인</text>
  </g>

  <rect x="836" y="132" width="292" height="512" rx="12" fill="#f9fbfc" stroke="#cbd6e2"/>
  <text x="860" y="172" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#233142">상세 안내</text>
  <text x="860" y="206" font-family="Arial, sans-serif" font-size="15" fill="#4b5b6b">선택한 단계의 작업 표시</text>

  <g font-family="Arial, sans-serif">
    <rect x="860" y="236" width="236" height="64" rx="8" fill="#ffffff" stroke="#d5dee8"/>
    <text x="878" y="263" font-size="16" font-weight="700" fill="#233142">컴포넌트 목록</text>
    <text x="878" y="284" font-size="13" fill="#526273">Label, Image, Button...</text>

    <rect x="860" y="316" width="236" height="64" rx="8" fill="#ffffff" stroke="#d5dee8"/>
    <text x="878" y="343" font-size="16" font-weight="700" fill="#233142">블록 구현 순서</text>
    <text x="878" y="364" font-size="13" fill="#526273">촬영, 선택, 분석, 표시</text>

    <rect x="860" y="396" width="236" height="64" rx="8" fill="#ffffff" stroke="#d5dee8"/>
    <text x="878" y="423" font-size="16" font-weight="700" fill="#233142">테스트 체크리스트</text>
    <text x="878" y="444" font-size="13" fill="#526273">Android, iPhone, API</text>

    <rect x="860" y="492" width="236" height="96" rx="8" fill="#fff7f5" stroke="#e4b0a2"/>
    <text x="878" y="522" font-size="15" font-weight="700" fill="#883e27">AI 분석 결과는 참고용입니다.</text>
    <text x="878" y="550" font-size="13" fill="#6d483f">복용 전 반드시 약사 또는</text>
    <text x="878" y="570" font-size="13" fill="#6d483f">의사에게 확인하세요.</text>
  </g>
</svg>
