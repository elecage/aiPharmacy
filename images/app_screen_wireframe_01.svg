  <text x="450" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111827">약 종류 확인 도우미</text>

  <text x="450" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">약 종류 확인 도우미</text>
  <text x="450" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">약 사진을 촬영하거나 선택하세요.</text>

  <rect x="320" y="310" width="260" height="260" rx="18" fill="#eef2f7" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="450" cy="415" r="52" fill="#d7dee8"/>
  <path d="M397 482 C425 452 475 452 503 482" fill="none" stroke="#9aa6b2" stroke-width="12" stroke-linecap="round"/>
  <text x="450" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">선택한 약 사진</text>

  <rect x="320" y="610" width="120" height="52" rx="8" fill="#2563eb"/>
  <text x="380" y="643" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">사진 촬영</text>
  <rect x="460" y="610" width="120" height="52" rx="8" fill="#0f766e"/>
  <text x="520" y="643" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">사진 선택</text>

  <rect x="320" y="690" width="260" height="58" rx="8" fill="#7c3aed"/>
  <text x="450" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">AI 분석하기</text>

  <rect x="320" y="795" width="260" height="150" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="450" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">분석 결과</text>
