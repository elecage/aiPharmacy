  <text x="450" y="1042" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">복용 전 반드시 약사 또는 의사에게 확인하세요.</text>

  <text x="450" y="1165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">[그림 1] 앱 화면 와이어프레임</text>
